<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TCC Duct Take Off V5</title><style>body{margin:0;background:#240014;color:#fff;font:14px Arial}main{max-width:1500px;margin:auto;padding:16px}.top,.card{border:1px solid #713052;background:#300019;border-radius:10px;padding:14px}.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.brand{font-size:27px;font-weight:900}.brand span{color:#8ec9ee}.grid{display:grid;grid-template-columns:470px 1fr;gap:14px;margin-top:14px}.viewer{height:620px;overflow:auto;background:#100008;text-align:center}.viewer canvas{max-width:100%}button,label{border:1px solid #8ec9ee;background:#8ec9ee;color:#16000d;border-radius:7px;padding:9px 12px;font-weight:900}input{width:48px}table{width:100%;border-collapse:collapse;margin-top:10px}th,td{padding:7px;border-bottom:1px solid #54243e;text-align:left}th{color:#b9dff5;font-size:11px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.stat{background:#3b0020;border:1px solid #713052;border-radius:7px;padding:8px}.stat b{display:block;color:#8ec9ee;font-size:19px;margin-top:3px}.note{color:#b9dff5;font-size:12px}.warn{color:#ffd27d}@media(max-width:900px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}}</style></head><body><main><div class="top"><div><div class="brand">TCC <span>DUCT TAKE OFF</span></div><div class="note">V5 — results-first test build</div></div><input id="file" type="file" accept="application/pdf"><label>Scale 1:<input id="scale" value="75"></label><button id="scan">AUTOMATIC TAKE-OFF</button><span id="status" class="note">Load the C5 PDF.</span></div><div class="grid"><div class="card"><h3>DRAWING</h3><div class="viewer" id="viewer"></div></div><div class="card"><h3>TAKE-OFF RESULTS</h3><div class="stats"><div class="stat">Total duct m<b id="duct">0.0</b></div><div class="stat">Spiral m<b id="spiral">0.0</b></div><div class="stat">Rect m<b id="rect">0.0</b></div><div class="stat">Runs<b id="runs">0</b></div></div><h3>Duct by size</h3><table><thead><tr><th>TYPE</th><th>SIZE</th><th>METRES</th><th>STOCK</th><th>SUPPORTS</th></tr></thead><tbody id="rows"><tr><td colspan="5" class="note">No scan yet.</td></tr></tbody></table><h3>Sizes actually found in drawing text</h3><div id="sizes" class="note">—</div><h3>Diagnostics</h3><div id="diag" class="note">Waiting.</div></div></div></main><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><script>pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';const $=id=>document.getElementById(id),OPS=pdfjsLib.OPS;let doc;const mul=(a,b)=>pdfjsLib.Util.transform(a,b),pt=(m,x,y)=>pdfjsLib.Util.applyTransform([x,y],m),idle=()=>new Promise(r=>requestAnimationFrame(r));const SP=[100,125,150,200,224,250,300,315,355,400,450,500,560,600,630,710,800,900,1000,1100,1200];function norm(s){return String(s||'').toUpperCase().replace(/\s+/g,'').replace(/×/g,'X').replace(/Ø/g,'').replace(/MM/g,'')}function parseSize(s){let t=norm(s),m=t.match(/^(\d{2,4})(?:X(\d{2,4}))?$/);if(!m)return null;if(m[2])return m[1]+'x'+m[2];let n=+m[1];return SP.includes(n)?'Ø'+n:null}function col(c){if(!c)return[0,0,0];let a=[c[0]||0,c[1]||0,c[2]||0];if(Math.max(...a)>1)a=a.map(v=>v/255);return a}function hv(c){let[r,g,b]=col(c);return(r>.65&&g<.55&&b<.45)||(r<.4&&g<.8&&b>.55)||(r<.8&&g>.3&&b>.7)}function add(o,m,x1,y1,x2,y2,c){let a=pt(m,x1,y1),b=pt(m,x2,y2),L=Math.hypot(b[0]-a[0],b[1]-a[1]);if(L>.2)o.push({a,b,c})}function path(arg,m,out,c){let ops=arg[0],a=arg[1],j=0,x=0,y=0,sx=0,sy=0;for(const op of ops){if(op===OPS.rectangle){let X=a[j++],Y=a[j++],W=a[j++],H=a[j++];add(out,m,X,Y,X+W,Y,c);add(out,m,X+W,Y,X+W,Y+H,c);add(out,m,X+W,Y+H,X,Y+H,c);add(out,m,X,Y+H,X,Y,c);x=X;y=Y;sx=X;sy=Y}else if(op===OPS.moveTo){x=a[j++];y=a[j++];sx=x;sy=y}else if(op===OPS.lineTo){let nx=a[j++],ny=a[j++];add(out,m,x,y,nx,ny,c);x=nx;y=ny}else if(op===OPS.closePath){add(out,m,x,y,sx,sy,c);x=sx;y=sy}else if(op===OPS.curveTo){let x1=a[j++],y1=a[j++],x2=a[j++],y2=a[j++],nx=a[j++],ny=a[j++],px=x,py=y;for(let k=1;k<=8;k++){let t=k/8,u=1-t,qx=u*u*u*x+3*u*u*t*x1+3*u*t*t*x2+t*t*t*nx,qy=u*u*u*y+3*u*u*t*y1+3*u*t*t*y2+t*t*t*ny;add(out,m,px,py,qx,qy,c);px=qx;py=qy}x=nx;y=ny}}}function merge(segs){let out=[],tol=2.5,gap=7;for(const s of segs){let dx=s.b[0]-s.a[0],dy=s.b[1]-s.a[1],L=Math.hypot(dx,dy);if(L<.25)continue;let axis=Math.abs(dy)<=Math.max(.1*L,1)?'h':Math.abs(dx)<=Math.max(.1*L,1)?'v':null;if(!axis)continue;let key=axis==='h'?(s.a[1]+s.b[1])/2:(s.a[0]+s.b[0])/2,min=axis==='h'?Math.min(s.a[0],s.b[0]):Math.min(s.a[1],s.b[1]),max=axis==='h'?Math.max(s.a[0],s.b[0]):Math.max(s.a[1],s.b[1]);let q=out.find(z=>z.axis===axis&&Math.abs(z.key-key)<tol&&min<=z.max+gap&&max>=z.min-gap);if(q){q.min=Math.min(q.min,min);q.max=Math.max(q.max,max)}else out.push({axis,key,min,max})}return out.map(q=>({...q,len:q.max-q.min})).filter(q=>q.len>10)}function pairs(r){let o=[];for(let i=0;i<r.length;i++)for(let j=i+1;j<r.length;j++){let a=r[i],b=r[j];if(a.axis!==b.axis)continue;let sep=Math.abs(a.key-b.key),ov=Math.max(0,Math.min(a.max,b.max)-Math.max(a.min,b.min));if(sep>2&&sep<100&&ov/Math.min(a.len,b.len)>.3)o.push({axis:a.axis,key:(a.key+b.key)/2,min:Math.max(a.min,b.min),max:Math.min(a.max,b.max),len:ov,width:sep})}return o}function expected(s,scale){return s.includes('x')?s.split('x').map(Number).map(v=>v/25.4*72/scale):[+s.slice(1)/25.4*72/scale]}function link(items,runs,ps,scale){let found=[];for(const it of items){let s=parseSize(it.str);if(!s)continue;let best=null,score=1e9,ex=expected(s,scale);for(const r of ps){let q=r.axis==='h'?it.x:it.y,d=r.axis==='h'?Math.abs(it.y-r.key):Math.abs(it.x-r.key);if(q<r.min-100||q>r.max+100||d>100)continue;let err=Math.min(...ex.map(e=>Math.abs(r.width-e)/Math.max(e,1)));if(err<.75){let sc=d+err*80;if(sc<score){score=sc;best=r}}}if(!best)for(const r of runs){let q=r.axis==='h'?it.x:it.y,d=r.axis==='h'?Math.abs(it.y-r.key):Math.abs(it.x-r.key);if(q>=r.min-70&&q<=r.max+70&&d<70&&d<score){score=d;best={...r,width:0}}}if(best)found.push({...best,size:s})}let g=[];for(const a of found){let q=g.find(z=>z.size===a.size&&z.axis===a.axis&&Math.abs(z.key-a.key)<9&&Math.max(0,Math.min(z.max,a.max)-Math.max(z.min,a.min))>.15*Math.min(z.len,a.len));if(q){q.min=Math.min(q.min,a.min);q.max=Math.max(q.max,a.max);q.len=q.max-q.min}else g.push({...a})}return g.map(a=>({...a,m:a.len/72*25.4*scale/1000})).filter(a=>a.m>.35&&a.m<50)}$('file').onchange=async()=>{let f=$('file').files[0];if(!f)return;doc=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;let v=$('viewer');v.innerHTML='';for(let n=1;n<=doc.numPages;n++){let p=await doc.getPage(n),base=p.getViewport({scale:1}),sc=Math.min(680,v.clientWidth-10)/base.width,view=p.getViewport({scale:sc}),c=document.createElement('canvas');c.width=view.width;c.height=view.height;v.appendChild(c);await p.render({canvasContext:c.getContext('2d'),viewport:view}).promise}$('status').textContent='Drawing loaded.'};$('scan').onclick=async()=>{if(!doc)return;let scale=+$('scale').value||75,all=[],hvseg=[],items=[],opsn=0;for(let n=1;n<=doc.numPages;n++){let p=await doc.getPage(n),tc=await p.getTextContent(),vp=p.getViewport({scale:1});for(const it of tc.items){let t=it.transform||[1,0,0,1,0,0],str=String(it.str||'').trim();if(str)items.push({str,x:t[4]+(it.width||0)/2,y:t[5]+(it.height||8)/2})}let op=await p.getOperatorList({intent:'display'}),m=[1,0,0,1,0,0],c=[0,0,0],stack=[];for(let i=0;i<op.fnArray.length;i++){let fn=op.fnArray[i],a=op.argsArray[i];if(fn===OPS.save)stack.push({m:m.slice(),c:c.slice()});else if(fn===OPS.restore){let z=stack.pop();if(z){m=z.m;c=z.c}}else if(fn===OPS.transform)m=mul(m,a);else if(fn===OPS.setStrokeRGBColor)c=a.slice(0,3);else if(fn===OPS.setStrokeGray)c=[a[0],a[0],a[0]];else if(fn===OPS.setStrokeCMYKColor)c=[1-Math.min(1,a[0]+a[3]),1-Math.min(1,a[1]+a[3]),1-Math.min(1,a[2]+a[3])];else if(fn===OPS.constructPath){opsn++;path(a,m,all,c);if(hv(c))path(a,m,hvseg,c)}if((i&4095)===0)await idle()}}let ar=merge(all),hr=merge(hvseg),runs=hr.length?hr:ar,ps=pairs(runs),sized=link(items,runs,ps,scale),by={};for(const g of sized)by[g.size]=(by[g.size]||0)+g.m;let duct=0,sp=0,re=0;Object.entries(by).forEach(([s,m])=>{duct+=m;if(s[0]==='Ø')sp+=m;else re+=m});$('duct').textContent=duct.toFixed(1);$('spiral').textContent=sp.toFixed(1);$('rect').textContent=re.toFixed(1);$('runs').textContent=sized.length;let actual=[...new Set(items.map(i=>parseSize(i.str)).filter(Boolean))].sort((a,b)=>norm(a).localeCompare(norm(b),undefined,{numeric:true}));$('sizes').textContent=actual.length?actual.join(' • '):'No recognised duct sizes';$('rows').innerHTML=Object.entries(by).sort((a,b)=>a[0].localeCompare(b[0],undefined,{numeric:true})).map(([s,m])=>{let stock=s[0]==='Ø'?3:1.5;return`<tr><td>${s[0]==='Ø'?'Spiral':'Rectangular'}</td><td>${s}</td><td>${m.toFixed(2)}m</td><td>x${Math.ceil(m/stock)}</td><td>x${Math.max(1,Math.ceil(m/2.8))}</td></tr>`}).join('')||'<tr><td colspan="5">No size-linked runs.</td></tr>';$('diag').innerHTML=`Path operations: ${opsn}<br>Raw segments: ${all.length}<br>HVAC segments: ${hvseg.length}<br>Usable runs: ${ar.length}<br>HVAC runs: ${hr.length}<br>Paired candidates: ${ps.length}<br>Size-linked runs: ${sized.length}<br>Recognised drawing sizes: ${actual.length}`;$('status').textContent='Automatic scan complete.'};</script></body></html>
