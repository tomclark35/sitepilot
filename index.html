<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TCC Duct Take Off V7</title><style>body{margin:0;background:#240014;color:#fff;font:14px Arial}main{max-width:1450px;margin:auto;padding:16px}.top,.card{border:1px solid #713052;background:#300019;border-radius:9px;padding:13px}.top{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.brand{font-size:27px;font-weight:900}.brand span{color:#8ec9ee}.grid{display:grid;grid-template-columns:460px 1fr;gap:14px;margin-top:14px}.viewer{height:620px;overflow:auto;background:#100008;text-align:center}.viewer canvas{max-width:100%;height:auto}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.stat{background:#3b0020;border:1px solid #713052;border-radius:7px;padding:9px}.stat b{display:block;color:#8ec9ee;font-size:20px;margin-top:3px}table{width:100%;border-collapse:collapse;margin-top:8px}td,th{padding:7px;border-bottom:1px solid #54243e;text-align:left}th{color:#b9dff5;font-size:10px}.note{color:#b9dff5;font-size:12px}.err{color:#ff9b9b}button{border:1px solid #8ec9ee;background:#8ec9ee;color:#16000d;border-radius:7px;padding:9px 12px;font-weight:900;cursor:pointer}.section{margin-top:16px}.good{color:#9fe4ff}.warn{color:#ffd27d}input{padding:7px;border-radius:5px;border:1px solid #aaa}@media(max-width:900px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}}</style></head><body><main><div class="top"><div><div class="brand">TCC <span>DUCT TAKE OFF</span></div><div class="note">V7 — stable scan / results first</div></div><input id="file" type="file" accept="application/pdf"><span>Scale 1:<input id="scale" value="75" style="width:42px"></span><button id="scan">AUTOMATIC TAKE-OFF</button><span id="status" class="note">Choose drawing.</span></div><div class="grid"><div class="card"><h3>DRAWING</h3><div class="viewer" id="viewer"></div></div><div class="card"><h3>TAKE-OFF RESULTS</h3><div class="stats"><div class="stat">Total duct m<b id="duct">0.0</b></div><div class="stat">Spiral m<b id="spiral">0.0</b></div><div class="stat">Rect. m<b id="rect">0.0</b></div><div class="stat">Size marks<b id="marks">0</b></div></div><div class="section"><h3>DUCT BY SIZE</h3><table><thead><tr><th>TYPE</th><th>SIZE</th><th>MARKS ON DRAWING</th><th>METRES</th><th>STOCK</th><th>STOCK QTY</th><th>SUPPORTS</th></tr></thead><tbody id="rows"><tr><td colspan="7" class="note">No scan yet.</td></tr></tbody></table></div><div class="section"><h3>DRAWING SIZES FOUND</h3><div id="found" class="note">Waiting.</div></div><div class="section"><h3>SCAN STATUS</h3><div id="diag" class="note">Waiting.</div></div></div></div></main><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><script>pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';const $=id=>document.getElementById(id);let doc=null;const allowed=[100,125,150,200,224,250,300,315,355,400,450,500,560,600,630,710,800,900,1000,1100,1200];function clean(s){return String(s||'').toUpperCase().replace(/\s+/g,'').replace(/×/g,'X')}function parseSize(s){let t=clean(s),m=t.match(/^(?:Ø|O)?(\d{2,4})(?:X(\d{2,4}))?(?:Ø|MM)?$/);if(!m)return null;if(m[2])return m[1]+'x'+m[2];let n=Number(m[1]);return allowed.includes(n)?'Ø'+n:null}function num(s){return s[0]==='Ø'?Number(s.slice(1)):Number(s.split('x')[0])}window.onerror=(msg,src,line)=>{$('status').textContent='Scan error';$('diag').innerHTML='<span class="err">'+String(msg)+'</span> at line '+line;return false};$('file').onchange=async()=>{let f=$('file').files[0];if(!f)return;$('status').textContent='Loading drawing…';try{doc=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;let v=$('viewer');v.innerHTML='';for(let n=1;n<=doc.numPages;n++){let p=await doc.getPage(n),base=p.getViewport({scale:1}),w=Math.min(700,v.clientWidth-10),sc=w/base.width,view=p.getViewport({scale:sc}),c=document.createElement('canvas');c.width=view.width;c.height=view.height;v.appendChild(c);await p.render({canvasContext:c.getContext('2d'),viewport:view}).promise}$('status').textContent='Drawing loaded — ready to scan.'}catch(e){console.error(e);$('status').textContent='PDF failed to load';$('diag').innerHTML='<span class="err">'+e.message+'</span>'}};$('scan').onclick=async()=>{if(!doc){$('status').textContent='Choose PDF first.';return}let scale=Number($('scale').value)||75;$('status').textContent='Reading printed duct sizes…';$('diag').textContent='Reading drawing text first…';try{let all=[];for(let pn=1;pn<=doc.numPages;pn++){let p=await doc.getPage(pn),tc=await p.getTextContent();for(let i=0;i<tc.items.length;i++){let it=tc.items[i],s=parseSize(it.str);if(s)all.push({s,x:(it.transform||[1,0,0,1,0,0])[4],y:(it.transform||[1,0,0,1,0,0])[5]})}}let counts={};all.forEach(x=>counts[x.s]=(counts[x.s]||0)+1);let sizes=Object.keys(counts).sort((a,b)=>num(a)-num(b));$('marks').textContent=all.length;$('found').innerHTML=sizes.length?sizes.map(s=>'<b>'+s+'</b> × '+counts[s]).join(' &nbsp;•&nbsp; '):'No recognised duct sizes.';let rows=sizes.map(s=>{let spiral=s[0]==='Ø',stock=spiral?3:1.5;return`<tr><td>${spiral?'Spiral':'Rectangular'}</td><td>${s}</td><td>x${counts[s]}</td><td class="note">Geometry measuring next</td><td>${stock.toFixed(1)}m</td><td>—</td><td>—</td></tr>`}).join('');$('rows').innerHTML=rows||'<tr><td colspan="7">No recognised duct sizes found.</td></tr>';$('diag').innerHTML='<span class="good">Printed sizes successfully read.</span><br>Recognised size marks: '+all.length+'<br>Unique duct sizes: '+sizes.length+'<br>Scale used: 1:'+scale+'<br><span class="warn">Length measurement is deliberately not guessed from text. Geometry tracing is the next engine stage.</span>';$('status').textContent='Size scan complete.'}catch(e){console.error(e);$('status').textContent='Scan failed';$('diag').innerHTML='<span class="err">'+e.message+'</span>'}};</script></body></html>
