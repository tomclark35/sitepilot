<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TCC Test Build</title><style>body{margin:0;background:#240014;color:#fff;font:14px Arial}main{max-width:1400px;margin:auto;padding:18px}.top,.card{border:1px solid #713052;background:#300019;border-radius:9px;padding:14px}.top{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.brand{font-size:28px;font-weight:900}.brand span{color:#8ec9ee}button,label{border:1px solid #8ec9ee;background:#8ec9ee;color:#16000d;border-radius:7px;padding:9px 13px;font-weight:900;cursor:pointer}.dark{background:transparent;color:#fff}.grid{display:grid;grid-template-columns:500px 1fr;gap:14px;margin-top:14px}.viewer{height:650px;overflow:auto;background:#100008;text-align:center}.viewer canvas{max-width:100%;height:auto}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.stat{background:#3b0020;border:1px solid #713052;border-radius:7px;padding:9px}.stat b{display:block;color:#8ec9ee;font-size:20px;margin-top:3px}table{width:100%;border-collapse:collapse;margin-top:10px}td,th{padding:6px;border-bottom:1px solid #54243e;text-align:left}th{color:#b9dff5;font-size:10px}.note{color:#b9dff5;font-size:12px}.ok{color:#9fe4ff}.warn{color:#ffd27d}@media(max-width:900px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}}</style></head><body><main><div class="top"><div><div class="brand">TCC <span>DUCT TAKE OFF</span></div><div class="note">Geometry extraction test build</div></div><input id="file" type="file" accept="application/pdf"><label>Scale 1:<input id="scale" value="75" style="width:45px"></label><button id="scan">AUTOMATIC TAKE-OFF</button><span id="status" class="note">Choose the C5 PDF.</span></div><div class="grid"><div class="card"><h3>DRAWING</h3><div class="viewer" id="viewer"></div></div><div class="card"><h3>RESULT</h3><div class="stats"><div class="stat">Duct m<b id="duct">0.0</b></div><div class="stat">Spiral m<b id="spiral">0.0</b></div><div class="stat">Rect m<b id="rect">0.0</b></div><div class="stat">Size runs<b id="sr">0</b></div></div><table><thead><tr><th>TYPE</th><th>SIZE</th><th>METRES</th><th>STOCK QTY</th><th>SUPPORTS</th></tr></thead><tbody id="rows"><tr><td colspan="5" class="note">No scan yet.</td></tr></tbody></table><h3>ENGINE DIAGNOSTICS</h3><div id="diag" class="note">Waiting.</div></div></div></main><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><script>pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';const $=x=>document.getElementById(x),OPS=pdfjsLib.OPS;let doc=null;const tr=(m,x,y)=>pdfjsLib.Util.applyTransform([x,y],m),mul=(a,b)=>pdfjsLib.Util.transform(a,b),idle=()=>new Promise(r=>requestAnimationFrame(r));function col(c){if(!c)return[0,0,0];let a=[c[0]||0,c[1]||0,c[2]||0];if(Math.max(...a)>1)a=a.map(v=>v/255);return a}function hv(c){let[r,g,b]=col(c);return(r>.65&&g<.55&&b<.45)||(r<.4&&g<.8&&b>.55)||(r<.8&&g>.3&&b>.7)}function addLine(out,m,x1,y1,x2,y2,c){let a=tr(m,x1,y1),b=tr(m,x2,y2);if(Math.hypot(b[0]-a[0],b[1]-a[1])>.2)out.push({a:{x:a[0],y:a[1]},b:{x:b[0],y:b[1]},c})}function parse(arg,m,out,c){let ops=arg[0],a=arg[1],j=0,x=0,y=0,sx=0,sy=0;for(let op of ops){if(op===OPS.rectangle){let X=a[j++],Y=a[j++],W=a[j++],H=a[j++];addLine(out,m,X,Y,X+W,Y,c);addLine(out,m,X+W,Y,X+W,Y+H,c);addLine(out,m,X+W,Y+H,X,Y+H,c);addLine(out,m,X,Y+H,X,Y,c);x=X;y=Y;sx=X;sy=Y}else if(op===OPS.moveTo){x=a[j++];y=a[j++];sx=x;sy=y}else if(op===OPS.lineTo){let nx=a[j++],ny=a[j++];addLine(out,m,x,y,nx,ny,c);x=nx;y=ny}else if(op===OPS.closePath){addLine(out,m,x,y,sx,sy,c);x=sx;y=sy}else if(op===OPS.curveTo){let x1=a[j++],y1=a[j++],x2=a[j++],y2=a[j++],nx=a[j++],ny=a[j++];let px=x,py=y;for(let k=1;k<=6;k++){let t=k/6,u=1-t;let qx=u*u*u*x+3*u*u*t*x1+3*u*t*t*x2+t*t*t*nx,qy=u*u*u*y+3*u*u*t*y1+3*u*t*t*y2+t*t*t*ny;addLine(out,m,px,py,qx,qy,c);px=qx;py=qy}x=nx;y=ny}else if(op===OPS.curveTo2||op===OPS.curveTo3){let x1=a[j++],y1=a[j++],nx=a[j++],ny=a[j++];let px=x,py=y;for(let k=1;k<=6;k++){let t=k/6,u=1-t;let qx=u*u*x+2*u*t*x1+t*t*nx,qy=u*u*y+2*u*t*y1+t*t*ny;addLine(out,m,px,py,qx,qy,c);px=qx;py=qy}x=nx;y=ny}}}function merge(segs){let out=[],tol=3,gap=5;for(let s of segs){let dx=s.b.x-s.a.x,dy=s.b.y-s.a.y,L=Math.hypot(dx,dy);if(L<.25)continue;let axis=Math.abs(dy)<=Math.max(.08*L,.8)?'h':Math.abs(dx)<=Math.max(.08*L,.8)?'v':null;if(!axis)continue;let key=axis==='h'?(s.a.y+s.b.y)/2:(s.a.x+s.b.x)/2,min=axis==='h'?Math.min(s.a.x,s.b.x):Math.min(s.a.y,s.b.y),max=axis==='h'?Math.max(s.a.x,s.b.x):Math.max(s.a.y,s.b.y);let q=out.find(z=>z.axis===axis&&Math.abs(z.key-key)<tol&&min<=z.max+gap&&max>=z.min-gap);if(q){q.min=Math.min(q.min,min);q.max=Math.max(q.max,max)}else out.push({axis,key,min,max})}return out.map(q=>({...q,len:q.max-q.min})).filter(q=>q.len>12)}function pairs(runs){let o=[];for(let i=0;i<runs.length;i++)for(let j=i+1;j<runs.length;j++){let a=runs[i],b=runs[j];if(a.axis!==b.axis)continue;let sep=Math.abs(a.key-b.key),ov=Math.max(0,Math.min(a.max,b.max)-Math.max(a.min,b.min));if(sep>=2&&sep<=90&&ov/Math.min(a.len,b.len)>.35)o.push({axis:a.axis,key:(a.key+b.key)/2,min:Math.max(a.min,b.min),max:Math.min(a.max,b.max),len:ov,width:sep})}return o}function size(s){let t=String(s||'').toUpperCase().replace(/\s+/g,'').replace(/×/g,'X'),m=t.match(/^(?:Ø)?(\d{2,4})(?:X(\d{2,4}))?Ø?(?:MM)?$/);return m?(m[2]?m[1]+'x'+m[2]:'Ø'+m[1]):null}function dims(s){return s.includes('x')?s.split('x').map(Number):[Number(s.slice(1))]}function expected(s,scale){return dims(s).map(v=>v/25.4*72/scale)}function near(x,y,r,p=70){let q=r.axis==='h'?x:y;return q>=r.min-p&&q<=r.max+p}function dist(x,y,r){return r.axis==='h'?Math.abs(y-r.key):Math.abs(x-r.key)}function seed(items,runs,ps,scale){let out=[];for(let it of items){let s=size(it.str);if(!s)continue;let x=it.x,y=it.y,ex=expected(s,scale),best=null,score=1e9;for(let r of ps){if(!near(x,y,r,100))continue;let d=dist(x,y,r),err=Math.min(...ex.map(e=>Math.abs(r.width-e)/Math.max(e,1)));if(d<100&&err<.9){let z=d+err*70;if(z<score){score=z;best=r}}}if(!best)for(let r of runs){if(!near(x,y,r,70))continue;let d=dist(x,y,r);if(d<score){score=d;best={...r,paired:false}}}if(best)out.push({...best,size:s})}let groups=[];for(let g of out){let q=groups.find(z=>z.size===g.size&&z.axis===g.axis&&Math.abs(z.key-g.key)<10&&Math.max(0,Math.min(z.max,g.max)-Math.max(z.min,g.min))>Math.min(z.len,g.len)*.15);if(q){q.min=Math.min(q.min,g.min);q.max=Math.max(q.max,g.max);q.len=q.max-q.min}else groups.push({...g})}let seen=[];for(let g of groups){let q=seen.find(z=>z.size===g.size&&z.axis===g.axis&&Math.abs(z.key-g.key)<12&&Math.max(0,Math.min(z.max,g.max)-Math.max(z.min,g.min))/Math.min(z.len,g.len)>.45);if(q){if(g.len>q.len){q.min=g.min;q.max=g.max;q.len=g.len}}else seen.push(g)}return seen.map(g=>({...g,m:g.len/72*25.4*scale/1000})).filter(g=>g.m>.4&&g.m<40)}$('file').onchange=async()=>{let f=$('file').files[0];if(!f)return;try{doc=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;let v=$('viewer');v.innerHTML='';for(let n=1;n<=doc.numPages;n++){let p=await doc.getPage(n),base=p.getViewport({scale:1}),w=Math.min(700,v.clientWidth-10),sc=w/base.width,view=p.getViewport({scale:sc}),c=document.createElement('canvas');c.width=view.width;c.height=view.height;v.appendChild(c);await p.render({canvasContext:c.getContext('2d'),viewport:view}).promise}$('status').textContent='Drawing loaded.'}catch(e){console.error(e);$('status').textContent='PDF load failed.'}};$('scan').onclick=async()=>{if(!doc){$('status').textContent='Choose PDF first.';return}let scale=Number($('scale').value)||75;$('status').textContent='Scanning…';let all=[],hvseg=[],items=[],opsn=0;for(let pn=1;pn<=doc.numPages;pn++){let p=await doc.getPage(pn),tc=await p.getTextContent(),vp=p.getViewport({scale:1});for(let it of tc.items){let t=it.transform||[1,0,0,1,0,0];items.push({str:String(it.str||'').trim(),x:t[4]+(it.width||0)/2,y:t[5]+(it.height||8)/2,pageW:vp.width,pageH:vp.height})}let op=await p.getOperatorList({intent:'display'}),m=[1,0,0,1,0,0],st=[0,0,0],stack=[];for(let i=0;i<op.fnArray.length;i++){let fn=op.fnArray[i],arg=op.argsArray[i];if(fn===OPS.save)stack.push({m:m.slice(),c:st.slice()});else if(fn===OPS.restore){let z=stack.pop();if(z){m=z.m;st=z.c}}else if(fn===OPS.transform)m=mul(m,arg);else if(fn===OPS.setStrokeRGBColor)st=arg.slice(0,3);else if(fn===OPS.setStrokeGray)st=[arg[0],arg[0],arg[0]];else if(fn===OPS.setStrokeCMYKColor){let c=arg;st=[1-Math.min(1,c[0]+c[3]),1-Math.min(1,c[1]+c[3]),1-Math.min(1,c[2]+c[3])]}else if(fn===OPS.constructPath){opsn++;parse(arg,m,all,st);if(hv(st))parse(arg,m,hvseg,st)}if((i&4095)===0)await idle()} }let ar=merge(all),hr=merge(hvseg),runs=hr.length?hr:ar,ps=pairs(runs),sized=seed(items,runs,ps,scale),by={};for(let g of sized)by[g.size]=(by[g.size]||0)+g.m;let duct=0,spiral=0,rect=0;for(let [s,m] of Object.entries(by)){duct+=m;if(s[0]==='Ø')spiral+=m;else rect+=m}$('duct').textContent=duct.toFixed(1);$('spiral').textContent=spiral.toFixed(1);$('rect').textContent=rect.toFixed(1);$('sr').textContent=sized.length;let rows=Object.entries(by).sort((a,b)=>b[1]-a[1]);$('rows').innerHTML=rows.length?rows.map(([s,m])=>{let stock=s.includes('x')?1.5:3;return`<tr><td>${s.includes('x')?'Rectangular':'Spiral'}</td><td>${s}</td><td>${m.toFixed(2)}m</td><td>x${Math.ceil(m/stock)}</td><td>x${Math.max(1,Math.ceil(m/2.8))}</td></tr>`}).join(''):'<tr><td colspan="5">No size-linked runs found.</td></tr>';$('diag').innerHTML=`<span class="ok">Scan finished.</span><br>Path operations: ${opsn}<br>Raw segments: ${all.length}<br>HVAC-colour segments: ${hvseg.length}<br>All usable runs: ${ar.length}<br>HVAC usable runs: ${hr.length}<br>Paired candidates: ${ps.length}<br>Size-linked runs: ${sized.length}<br>Text items: ${items.length}`;$('status').textContent='Automatic scan complete.'};</script></body></html>
